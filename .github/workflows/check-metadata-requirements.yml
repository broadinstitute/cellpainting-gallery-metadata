name: Check metadata requirements

on:
  pull_request:
    paths: [harmonized_ontology.json]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_metadata_requirements.py
