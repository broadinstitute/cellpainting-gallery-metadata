name: Update metadata requirements

on:
  push:
    branches: [main]
    paths: [harmonized_ontology.json]
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/generate_metadata_requirements.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update metadata_requirements.md from harmonized_ontology.json"
          file_pattern: docs/metadata_requirements.md
