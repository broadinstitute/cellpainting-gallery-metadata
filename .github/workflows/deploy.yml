name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'inferable_relationships.json'
      - 'scripts/generate_inferable_relationships.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install mkdocs mkdocs-material
      - run: python scripts/generate_inferable_relationships.py
      - run: mkdocs gh-deploy --force
